<!--
  Pantalla: Actividad de masa — Naranja (Nivel 3)

  Pipo presenta una naranja y el estudiante elige el instrumento correcto.
  Interacción diferente: comparación entre balanza y otros objetos.

  Flujo: Banana → Naranja → Siguiente nivel
-->

<section class="pantalla bienvenida" id="pantalla-actividad-naranja">
  <!-- Paso 1: Pipo presenta la naranja -->
  <div class="paso-experiencia" id="paso-naranja-presentacion">
    <div class="tarjeta-bienvenida">
      <div class="pipo-figura">
        <img id="imagen-pipo-naranja" src="" alt="Mascota de NIDO" />
      </div>
      <p id="mensaje-naranja-presentacion" class="mensaje-pipo"></p>
      <button type="button" id="boton-continuar-naranja-presentacion" class="boton-principal">Seguir</button>
    </div>
  </div>

  <!-- Paso 2: ¿Cuál nos ayuda a conocer la masa? -->
  <div class="paso-experiencia oculto" id="paso-naranja-eleccion" aria-hidden="true">
    <div class="tarjeta-bienvenida">
      <div class="objeto-grande" aria-hidden="true">🍊</div>
      <p id="pregunta-naranja" class="mensaje-descubrimiento"></p>

      <div class="opciones-instrumento" id="opciones-naranja" role="listbox" aria-label="¿Cuál podemos usar para conocer la masa de la naranja?">
        <button type="button" class="opcion-instrumento" data-instrumento="balanza" role="option">
          <span class="icono-instrumento" aria-hidden="true">⚖️</span>
          <span class="nombre-instrumento">Balanza</span>
        </button>
        <button type="button" class="opcion-instrumento" data-instrumento="lupa" role="option">
          <span class="icono-instrumento" aria-hidden="true">🔍</span>
          <span class="nombre-instrumento">Lupa</span>
        </button>
        <button type="button" class="opcion-instrumento" data-instrumento="vaso" role="option">
          <span class="icono-instrumento" aria-hidden="true">🥛</span>
          <span class="nombre-instrumento">Vaso</span>
        </button>
      </div>

      <p id="mensaje-naranja" class="mensaje-pipo oculto" role="status" aria-live="polite"></p>
    </div>
  </div>

  <!-- Paso 3: Explicación y celebración -->
  <div class="paso-experiencia oculto" id="paso-naranja-explicacion" aria-hidden="true">
    <div class="tarjeta-bienvenida">
      <h2>¡Muy bien! 🎉</h2>
      <div class="pipo-figura">
        <img id="imagen-pipo-naranja-explicacion" src="" alt="Mascota de NIDO" />
      </div>
      <p id="mensaje-naranja-explicacion" class="mensaje-pipo"></p>
      <button type="button" id="boton-continuar-naranja-explicacion" class="boton-principal">Seguir</button>
    </div>
  </div>

  <!-- Paso 4: Recompensa y siguiente nivel -->
  <div class="paso-experiencia oculto" id="paso-naranja-recompensa" aria-hidden="true">
    <div class="tarjeta-bienvenida">
      <h2>🏆 ¡Lo lograste!</h2>
      <p id="mensaje-naranja-recompensa" class="mensaje-descubrimiento"></p>
      <button type="button" id="boton-siguiente-naranja" class="boton-principal">¡Seguimos!</button>
    </div>
  </div>
</section>
