<!--
  Pantalla: Mi NIDO (Etapa 3 — Paso 11)

  Espacio personal del estudiante.
  Pipo es el protagonista central, acompañando al estudiante
  y presentando las áreas futuras de su pequeño mundo.

  Flujo: Elección de mascota → Confirmación → Mi NIDO
-->

<section class="pantalla bienvenida" id="pantalla-mi-nido">
  <div class="tarjeta-bienvenida">
    <h2 id="saludo-mi-nido" class="saludo-mi-nido">¡Hola!</h2>

    <div class="zona-motivadora">
      <div class="pipo-figura" id="pipo-figura">
        <img id="imagen-pipo" src="" alt="Mascota de NIDO" />
      </div>
      <p id="mensaje-pipo" class="mensaje-pipo"></p>
    </div>

    <button type="button" id="boton-aventuras" class="area-destacada">
      <span class="icono-area" aria-hidden="true">🌟</span>
      <span class="titulo-opcion">Aventuras</span>
      <span class="descripcion-opcion">Empezá tu primera aventura con tu mascota.</span>
      <span class="indicador-proximo">Comenzar</span>
    </button>

    <div class="areas-secundarias">
      <div class="tarjeta-area-secundaria">
        <span class="icono-area" aria-hidden="true">🐧</span>
        <span class="titulo-opcion">Mi mascota</span>
        <span class="descripcion-opcion">Tu compañero</span>
      </div>
      <div class="tarjeta-area-secundaria">
        <span class="icono-area" aria-hidden="true">⭐</span>
        <span class="titulo-opcion">Progreso</span>
        <span class="descripcion-opcion">Tus logros</span>
      </div>
    </div>

    <button type="button" id="boton-volver-mi-nido" class="boton-secundario">Volver al inicio</button>
  </div>
</section>
