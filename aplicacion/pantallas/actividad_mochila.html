<!--
  Pantalla: Actividad de masa — Mochila (Nivel 4)

  Pipo presenta una mochila y el estudiante debe elegir entre
  dos situaciones: usar la balanza o usar otro objeto.
  Interacción diferente: comparación de situaciones.

  Flujo: Naranja → Mochila → Siguiente nivel
-->

<section class="pantalla bienvenida" id="pantalla-actividad-mochila">
  <!-- Paso 1: Pipo presenta la mochila -->
  <div class="paso-experiencia" id="paso-mochila-presentacion">
    <div class="tarjeta-bienvenida">
      <div class="pipo-figura">
        <img id="imagen-pipo-mochila" src="" alt="Mascota de NIDO" />
      </div>
      <p id="mensaje-mochila-presentacion" class="mensaje-pipo"></p>
      <button type="button" id="boton-continuar-mochila-presentacion" class="boton-principal">Seguir</button>
    </div>
  </div>

  <!-- Paso 2: ¿Qué hacemos para conocer la masa? -->
  <div class="paso-experiencia oculto" id="paso-mochila-eleccion" aria-hidden="true">
    <div class="tarjeta-bienvenida">
      <div class="objeto-grande" aria-hidden="true">🎒</div>
      <p id="pregunta-mochila" class="mensaje-descubrimiento"></p>

      <div class="opciones-instrumento" id="opciones-mochila" role="listbox" aria-label="¿Qué hacemos para conocer la masa de la mochila?">
        <button type="button" class="opcion-instrumento" data-instrumento="balanza" role="option">
          <span class="icono-instrumento" aria-hidden="true">⚖️</span>
          <span class="nombre-instrumento">Ponerla en la balanza</span>
        </button>
        <button type="button" class="opcion-instrumento" data-instrumento="mirar" role="option">
          <span class="icono-instrumento" aria-hidden="true">👀</span>
          <span class="nombre-instrumento">Mirarla</span>
        </button>
        <button type="button" class="opcion-instrumento" data-instrumento="escuchar" role="option">
          <span class="icono-instrumento" aria-hidden="true">👂</span>
          <span class="nombre-instrumento">Escucharla</span>
        </button>
      </div>

      <p id="mensaje-mochila" class="mensaje-pipo oculto" role="status" aria-live="polite"></p>
    </div>
  </div>

  <!-- Paso 3: Explicación y celebración -->
  <div class="paso-experiencia oculto" id="paso-mochila-explicacion" aria-hidden="true">
    <div class="tarjeta-bienvenida">
      <h2>¡Muy bien! 🎉</h2>
      <div class="pipo-figura">
        <img id="imagen-pipo-mochila-explicacion" src="" alt="Mascota de NIDO" />
      </div>
      <p id="mensaje-mochila-explicacion" class="mensaje-pipo"></p>
      <button type="button" id="boton-continuar-mochila-explicacion" class="boton-principal">Seguir</button>
    </div>
  </div>

  <!-- Paso 4: Recompensa y siguiente nivel -->
  <div class="paso-experiencia oculto" id="paso-mochila-recompensa" aria-hidden="true">
    <div class="tarjeta-bienvenida">
      <h2>🏆 ¡Lo lograste!</h2>
      <p id="mensaje-mochila-recompensa" class="mensaje-descubrimiento"></p>
      <button type="button" id="boton-siguiente-mochila" class="boton-principal">¡Seguimos!</button>
    </div>
  </div>
</section>
