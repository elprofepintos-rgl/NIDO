<section class="pantalla-presentacion" id="pantalla-presentacion-nido" aria-label="Presentación de NIDO">
  <video
    id="video-presentacion-nido"
    class="video-presentacion"
    src="../../video/Presentacion NIDO.mp4"
    autoplay
    muted
    playsinline
    preload="auto"
    aria-label="Presentación de NIDO"
  ></video>

  <!-- Botón flotante para activar el sonido si el navegador bloquea el autoplay con audio -->
  <button type="button" id="boton-activar-sonido" class="boton-sonido oculto" aria-label="Activar sonido de la presentación">
    <span class="icono-sonido" aria-hidden="true">🔊</span>
    <span class="texto-sonido">Activar sonido</span>
  </button>
</section>
