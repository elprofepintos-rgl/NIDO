<section class="pantalla-presentacion" id="pantalla-presentacion-nido" aria-label="Presentación de NIDO">
  <video
    id="video-presentacion-nido"
    class="video-presentacion"
    src="../../video/Presentacion NIDO.mp4"
    playsinline
    preload="auto"
    aria-label="Presentación de NIDO"
  ></video>

  <!-- Invitación inicial para habilitar el audio mediante interacción del usuario -->
  <div class="invitacion-presentacion" id="invitacion-presentacion">
    <div class="tarjeta-invitacion">
      <div class="icono-invitacion" aria-hidden="true">🔊</div>
      <h2 class="titulo-invitacion">¡Conocé NIDO!</h2>
      <p class="texto-invitacion">Pipo te espera para empezar la aventura.</p>
      <button type="button" id="boton-iniciar-presentacion" class="boton-principal boton-iniciar-presentacion">
        ▶ Empezar
      </button>
    </div>
  </div>
</section>
